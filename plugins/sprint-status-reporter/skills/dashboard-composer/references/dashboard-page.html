<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulse dashboard</title>
<style>
  :root {
    color-scheme: light;
    --surface: #ffffff;
    --sunken: #f4f6f8;
    --hairline: #d3d9e0;
    --edge: #5b6470;
    --text: #1a1d21;
    --muted: #5b6470;
    --focus: #123f8c;
    --delivered: #14653a;
    --in-progress: #123f8c;
    --currently-at-risk: #8a3a06;
    --newly-at-risk: #9b1c31;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 24px 20px 48px;
    background: var(--surface);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }

  main { max-width: 860px; margin: 0 auto; }

  h1 { font-size: 1.75rem; margin: 0 0 4px; color: var(--text); }
  h2 { font-size: 1.1rem; margin: 0; color: var(--text); }
  h3 { font-size: 0.95rem; margin: 16px 0 4px; color: var(--text); }
  p { margin: 0 0 8px; }

  .sprint { color: var(--text); font-weight: 600; margin: 0 0 2px; }
  .stamp { color: var(--muted); font-size: 0.9rem; margin: 0 0 20px; }

  [role="tablist"] {
    display: flex;
    gap: 8px;
    margin: 0 0 20px;
    border-bottom: 2px solid var(--hairline);
    padding-bottom: 12px;
  }

  [role="tab"] {
    min-height: 44px;
    min-width: 44px;
    padding: 10px 18px;
    font: inherit;
    font-weight: 600;
    color: var(--text);
    background: var(--surface);
    border: 2px solid var(--edge);
    border-radius: 6px;
    cursor: pointer;
  }

  [role="tab"][aria-selected="true"] {
    color: var(--surface);
    background: var(--in-progress);
    border-color: var(--in-progress);
  }

  button:focus-visible,
  textarea:focus-visible {
    outline: none;
    box-shadow: 0 0 0 3px var(--surface), 0 0 0 6px var(--focus);
  }

  .bucket {
    border: 1px solid var(--hairline);
    border-left: 6px solid var(--accent);
    border-radius: 6px;
    background: var(--sunken);
    padding: 14px 16px;
    margin: 0 0 16px;
  }

  .bucket--tag { --accent: var(--in-progress); }
  .bucket--new-since { --accent: var(--newly-at-risk); }

  .bucket-head { display: flex; align-items: baseline; gap: 10px; }
  .bucket-head h2 { color: var(--accent); }
  .count {
    color: var(--surface);
    background: var(--accent);
    border-radius: 999px;
    padding: 2px 10px;
    font-size: 0.85rem;
    font-weight: 700;
  }

  .count-group { display: flex; gap: 6px; margin-left: auto; }

  .count--active { --accent: var(--in-progress); }
  .count--closed { --accent: var(--delivered); }

  .tile-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 10px;
    margin: 0 0 20px;
  }

  ul.items { list-style: none; margin: 12px 0 0; padding: 0; }

  .item {
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 6px;
    padding: 10px 12px;
    margin: 0 0 8px;
  }

  .tile { margin: 0; }

  .item-id { font-weight: 700; color: var(--accent); margin-right: 6px; }
  .item-title { font-weight: 600; }
  .item-meta { color: var(--muted); font-size: 0.875rem; margin: 4px 0 0; }
  .item-blurb { margin: 4px 0 0; }

  .reason {
    display: inline-block;
    margin: 6px 0 0;
    padding: 2px 8px;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--currently-at-risk);
    background: var(--surface);
    border: 2px solid var(--currently-at-risk);
    border-radius: 4px;
  }

  .new-marker {
    display: inline-block;
    margin-left: 6px;
    padding: 1px 6px;
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--surface);
    background: var(--newly-at-risk);
    border-radius: 4px;
    vertical-align: middle;
  }

  .note { color: var(--muted); margin: 12px 0 0; }

  .banner {
    border: 2px solid var(--currently-at-risk);
    border-radius: 6px;
    padding: 12px 14px;
    margin: 0 0 16px;
    color: var(--currently-at-risk);
    font-weight: 600;
    background: var(--surface);
  }

  ul.warnings { margin: 20px 0 0; padding-left: 22px; color: var(--muted); }

  .copy-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin: 0 0 12px; }

  #copy-button {
    min-height: 44px;
    min-width: 44px;
    padding: 10px 20px;
    font: inherit;
    font-weight: 600;
    color: var(--surface);
    background: var(--in-progress);
    border: 2px solid var(--in-progress);
    border-radius: 6px;
    cursor: pointer;
  }

  #copy-button[disabled] {
    color: var(--text);
    background: var(--sunken);
    border-color: var(--edge);
    cursor: not-allowed;
  }

  #copy-status { color: var(--muted); margin: 0; }

  textarea {
    width: 100%;
    min-height: 420px;
    padding: 12px;
    color: var(--text);
    background: var(--surface);
    border: 2px solid var(--edge);
    border-radius: 6px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.9rem;
    line-height: 1.5;
    resize: vertical;
  }

  [hidden] { display: none !important; }
</style>
</head>
<body>
<main data-testid="pulse-dashboard">
  <h1>Pulse</h1>
  <p class="sprint" id="sprint-line" data-testid="pulse-dashboard-sprint" hidden></p>
  <p class="stamp">Last updated <time id="updated-at" data-testid="pulse-dashboard-updated-at">not yet</time></p>

  <div role="tablist" aria-label="Dashboard views" data-testid="pulse-dashboard-view-toggle">
    <button type="button" role="tab" id="tab-live" aria-controls="panel-live" aria-selected="true" data-testid="pulse-dashboard-live-tab">Live status</button>
    <button type="button" role="tab" id="tab-deck" aria-controls="panel-deck" aria-selected="false" data-testid="pulse-dashboard-deck-tab">Copy for deck</button>
  </div>

  <section id="panel-live" role="tabpanel" aria-labelledby="tab-live" data-testid="pulse-dashboard-live-view">
    <p class="note" id="loading-state" role="status" data-testid="pulse-dashboard-loading-state">Loading the latest sprint data.</p>
    <p class="note" id="empty-state" data-testid="pulse-dashboard-empty-state" hidden>No sprint data has been published to this dashboard yet. Run the pulse command to fill it in.</p>
    <p class="banner" id="error-state" role="alert" data-testid="pulse-dashboard-error-state" hidden></p>
    <div id="live-content" hidden></div>
    <ul class="warnings" id="warnings" data-testid="pulse-dashboard-warnings" hidden></ul>
  </section>

  <section id="panel-deck" role="tabpanel" aria-labelledby="tab-deck" data-testid="pulse-dashboard-deck-view" hidden>
    <div class="copy-row">
      <button type="button" id="copy-button" data-testid="pulse-dashboard-copy-button" disabled>Copy to clipboard</button>
      <p id="copy-status" role="status" data-testid="pulse-dashboard-copy-status"></p>
    </div>
    <label for="deck-text">Paste-ready text for the deck</label>
    <textarea id="deck-text" data-testid="pulse-dashboard-deck-text" readonly spellcheck="false"></textarea>
  </section>
</main>

<script>
(function () {
  "use strict";

  var DOC_PATH = "dashboard/current";

  var TABS = [
    { tab: "tab-live", panel: "panel-live" },
    { tab: "tab-deck", panel: "panel-deck" }
  ];

  var sprintLine = document.getElementById("sprint-line");
  var updatedAt = document.getElementById("updated-at");
  var loadingState = document.getElementById("loading-state");
  var emptyState = document.getElementById("empty-state");
  var errorState = document.getElementById("error-state");
  var liveContent = document.getElementById("live-content");
  var warningsList = document.getElementById("warnings");
  var deckText = document.getElementById("deck-text");
  var copyButton = document.getElementById("copy-button");
  var copyStatus = document.getElementById("copy-status");

  function element(tag, className) {
    var node = document.createElement(tag);
    if (className) { node.className = className; }
    return node;
  }

  function textNode(tag, className, value) {
    var node = element(tag, className);
    node.textContent = value;
    return node;
  }

  function show(node) { node.hidden = false; }
  function hide(node) { node.hidden = true; }

  function selectTab(selectedId) {
    TABS.forEach(function (entry) {
      var tab = document.getElementById(entry.tab);
      var panel = document.getElementById(entry.panel);
      var selected = entry.tab === selectedId;
      tab.setAttribute("aria-selected", String(selected));
      panel.hidden = !selected;
    });
  }

  TABS.forEach(function (entry) {
    document.getElementById(entry.tab).addEventListener("click", function () {
      selectTab(entry.tab);
    });
  });

  function metaLine(item) {
    var parts = [];
    var state = item.to_state || item.state;
    if (state) { parts.push(String(state)); }
    if (item.assignee) { parts.push(String(item.assignee)); }
    if (item.points !== null && item.points !== undefined) { parts.push(item.points + " pts"); }
    if (item.days_since_update !== null && item.days_since_update !== undefined) {
      parts.push("idle " + item.days_since_update + "d");
    }
    return parts.join(", ");
  }

  function itemRow(testidPrefix, item) {
    var row = element("li", "item");
    row.dataset.testid = "pulse-dashboard-" + testidPrefix + "-item-" + item.id;

    var heading = element("p", "item-line");
    heading.appendChild(textNode("span", "item-id", String(item.id)));
    heading.appendChild(textNode("span", "item-title", item.title ? String(item.title) : ""));
    if (item.newly_at_risk) { heading.appendChild(textNode("span", "new-marker", "NEW")); }
    row.appendChild(heading);

    var meta = metaLine(item);
    if (meta) { row.appendChild(textNode("p", "item-meta", meta)); }
    if (item.blurb) { row.appendChild(textNode("p", "item-blurb", String(item.blurb))); }
    if (item.reason) { row.appendChild(textNode("span", "reason", String(item.reason))); }

    return row;
  }

  function itemList(testidPrefix, items) {
    var list = element("ul", "items");
    items.forEach(function (item) { list.appendChild(itemRow(testidPrefix, item)); });
    return list;
  }

  function tagSlug(label) {
    return String(label)
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, "-")
      .replace(/^-+|-+$/g, "");
  }

  function resolveTagSlugs(tags) {
    var seen = Object.create(null);
    return tags.map(function (tagEntry) {
      var base = tagSlug(tagEntry.tag);
      var occurrence = seen[base] || 0;
      seen[base] = occurrence + 1;
      return occurrence === 0 ? base : base + "-" + (occurrence + 1);
    });
  }

  function tile(tagEntry, slug) {
    var card = element("div", "item tile");
    card.dataset.testid = "pulse-dashboard-tag-" + slug + "-tile";

    var head = element("div", "bucket-head");
    head.appendChild(textNode("p", "item-title", String(tagEntry.tag)));

    var counts = element("div", "count-group");

    var activeCount = textNode("span", "count count--active", String(tagEntry.active_count));
    activeCount.dataset.testid = "pulse-dashboard-tag-" + slug + "-active-count";
    counts.appendChild(activeCount);

    var closedCount = textNode("span", "count count--closed", String(tagEntry.closed_count));
    closedCount.dataset.testid = "pulse-dashboard-tag-" + slug + "-closed-count";
    counts.appendChild(closedCount);

    head.appendChild(counts);
    card.appendChild(head);
    return card;
  }

  function tileGrid(tags, slugs) {
    var grid = element("div", "tile-grid");
    tags.forEach(function (tagEntry, index) {
      grid.appendChild(tile(tagEntry, slugs[index]));
    });
    return grid;
  }

  function tagSectionHead(tagEntry) {
    var head = element("div", "bucket-head");
    head.appendChild(textNode("h2", null, String(tagEntry.tag)));
    return head;
  }

  function tagSubList(headingText, testidPrefix, items) {
    var wrap = element("div", null);
    wrap.appendChild(textNode("h3", null, headingText));
    var body = items.length ? itemList(testidPrefix, items) : textNode("p", "note", "None.");
    body.dataset.testid = "pulse-dashboard-" + testidPrefix + "-list";
    wrap.appendChild(body);
    return wrap;
  }

  function tagSection(tagEntry, slug) {
    var section = element("section", "bucket bucket--tag");
    section.dataset.testid = "pulse-dashboard-tag-" + slug + "-section";
    section.appendChild(tagSectionHead(tagEntry));
    section.appendChild(tagSubList("Active", "tag-" + slug + "-active", tagEntry.active_items));
    section.appendChild(tagSubList("Closed", "tag-" + slug + "-closed", tagEntry.closed_items));
    return section;
  }

  function newSinceSection(newSince) {
    var section = element("section", "bucket bucket--new-since");
    section.dataset.testid = "pulse-dashboard-new-since-section";

    var head = element("div", "bucket-head");
    head.appendChild(textNode("h2", null, "New since " + newSince.window_from));
    var counts = element("div", "count-group");
    var badge = textNode("span", "count", String(newSince.count));
    badge.dataset.testid = "pulse-dashboard-new-since-count";
    counts.appendChild(badge);
    head.appendChild(counts);
    section.appendChild(head);

    var items = Array.isArray(newSince.items) ? newSince.items : [];
    var list = items.length ? itemList("new-since", items) : textNode("p", "note", "None.");
    list.dataset.testid = "pulse-dashboard-new-since-list";
    section.appendChild(list);

    return section;
  }

  function noDeltaNote() {
    var note = textNode("p", "note", "No delta available yet, so nothing can be marked new since the last check. This is a point-in-time view.");
    note.dataset.testid = "pulse-dashboard-no-delta-state";
    return note;
  }

  function renderSprint(sprint) {
    if (!sprint || !sprint.name) { hide(sprintLine); return; }
    var line = String(sprint.name);
    if (sprint.start && sprint.end) { line += " (" + sprint.start + " to " + sprint.end + ")"; }
    sprintLine.textContent = line;
    show(sprintLine);
  }

  function renderWarnings(warnings) {
    warningsList.replaceChildren();
    if (!Array.isArray(warnings) || !warnings.length) { hide(warningsList); return; }
    warnings.forEach(function (warning) {
      warningsList.appendChild(textNode("li", null, String(warning)));
    });
    show(warningsList);
  }

  function renderDeckText(text) {
    var value = typeof text === "string" ? text : "";
    deckText.value = value;
    copyButton.disabled = value.length === 0;
    copyStatus.textContent = "";
  }

  function render(document_) {
    var view = document_ && document_.live_view ? document_.live_view : null;
    if (!view) {
      showEmpty();
      return;
    }

    renderSprint(document_.sprint);
    updatedAt.textContent = view.generated_at ? String(view.generated_at) : "not yet";
    if (view.generated_at) { updatedAt.setAttribute("datetime", String(view.generated_at)); }

    var tags = Array.isArray(view.tags) ? view.tags : [];
    var slugs = resolveTagSlugs(tags);

    liveContent.replaceChildren();
    if (view.delta_available === false) { liveContent.appendChild(noDeltaNote()); }
    if (view.new_since) { liveContent.appendChild(newSinceSection(view.new_since)); }
    liveContent.appendChild(tileGrid(tags, slugs));
    tags.forEach(function (tagEntry, index) {
      liveContent.appendChild(tagSection(tagEntry, slugs[index]));
    });

    renderWarnings(document_.warnings);
    renderDeckText(document_.deck_text);

    hide(loadingState);
    hide(emptyState);
    hide(errorState);
    show(liveContent);
  }

  function showEmpty() {
    hide(loadingState);
    hide(errorState);
    hide(liveContent);
    renderDeckText("");
    show(emptyState);
  }

  function showError(message) {
    hide(loadingState);
    hide(emptyState);
    hide(liveContent);
    renderDeckText("");
    errorState.textContent = message;
    show(errorState);
  }

  copyButton.addEventListener("click", function () {
    var text = deckText.value;
    if (!text) { return; }
    var clipboard = navigator.clipboard;
    if (!clipboard || typeof clipboard.writeText !== "function") {
      selectForManualCopy();
      return;
    }
    clipboard.writeText(text).then(function () {
      copyStatus.textContent = "Copied to the clipboard.";
    }, function () {
      selectForManualCopy();
    });
  });

  function selectForManualCopy() {
    deckText.focus();
    deckText.select();
    copyStatus.textContent = "The clipboard is not available here. The text is selected, so press Ctrl+C or Cmd+C.";
  }

  function onDocument(snapshot) {
    if (!snapshot.exists) {
      showEmpty();
      return;
    }
    render(snapshot.data());
  }

  function onStoreError(error) {
    var code = error && error.code ? error.code : "unavailable";
    showError("The dashboard data could not be read (" + code + "). The last data this page loaded is not shown.");
  }

  function start() {
    if (!window.claude || typeof window.claude.use !== "function") {
      showError("This page needs the Claude artifact runtime to load its data.");
      return;
    }
    window.claude.use("db").then(function (db) {
      if (!db) {
        showError("Live data is unavailable in this view.");
        return;
      }
      db.doc(DOC_PATH).onSnapshot(onDocument, onStoreError);
    }, function () {
      showError("Live data is unavailable in this view.");
    });
  }

  selectTab("tab-live");
  start();
})();
</script>
</body>
</html>
